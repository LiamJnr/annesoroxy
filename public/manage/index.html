<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="robots" content="noindex,nofollow" /><title>Roxy — Request manager</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css?v=20261124-1" /></head>
<body><main class="manager"><header><p>ROXY / PRIVATE REQUESTS</p><span>MANAGER</span></header><section class="intro"><p class="eyebrow">CREATE A PRIVATE PAYMENT LINK</p><h1>Set the terms.<br /><em>Send the link.</em></h1><p>Only the exact amount you enter is available to the recipient. Links are fixed-price and can expire.</p></section><section class="card"><h2>New request</h2><form id="request-form"><label><span>Description</span><input id="description" maxlength="180" placeholder="e.g. Custom video request — Ava" required /></label><div class="row"><label><span>Amount (USD)</span><input id="amount" type="number" min="0.01" max="10000" step="0.01" inputmode="decimal" placeholder="0.00" required /></label><label><span>Expiry (optional)</span><input id="expires-at" type="datetime-local" /></label></div><button class="button" type="submit">Create private payment link <span>↗</span></button><p id="form-status" class="status" role="status" aria-live="polite"></p></form></section><section id="new-link" class="new-link" hidden><p class="eyebrow">READY TO SEND</p><p id="new-link-description"></p><div><code id="new-link-value"></code><button id="copy-link" type="button">Copy</button></div></section><section class="list"><div class="list-head"><h2>Recent links</h2><button id="refresh-list" type="button">Refresh</button></div><div id="request-list" aria-live="polite">Loading requests…</div></section></main><script type="module" src="scripts/app.js?v=20261124-1"></script></body></html>
