<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Roxy — Confirming payment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="confirmation">
      <p class="eyebrow">ROXY / SECURE CONFIRMATION</p>
      <div class="mark" aria-hidden="true">✓</div>
      <h1 id="confirmation-title">Confirming your payment.</h1>
      <p id="confirmation-message" class="message" aria-live="polite">Please keep this page open while we verify it securely.</p>
      <a id="home-link" href="/" hidden>Return home <span aria-hidden="true">↗</span></a>
    </main>
    <script src="script.js"></script>
  </body>
</html>
