<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Independent creator — custom content, pre-made work, and supporter tips." />
    <title>Roxy — Private Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="landing">
      <div class="wordmark" aria-label="Roxy home">ROXY / 01</div>

      <section class="stage" aria-labelledby="headline">
        <div class="copy">
          <p class="eyebrow">PRIVATE ACCESS · 2026</p>
          <h1 id="headline">You know who I am<br />and you know <em>why</em> you’re here.</h1>
        </div>

        <div class="media-placeholder">
          <div class="media-grain"></div>
          <video class="display-video" autoplay loop muted playsinline aria-label="Creator video preview">
            <source src="media/display-video.webm" type="video/webm" />
          </video>
          <span class="media-index">01 / 01</span>
        </div>

        <div class="actions" aria-label="Choose an option">
          <button class="action-button primary" type="button" id="custom-toggle" aria-expanded="false" aria-controls="custom-tray">
            <span>Request custom content</span>
          </button>
          <div class="custom-tray" id="custom-tray" hidden aria-label="Custom content queue">
            <div class="queue-status">
              <span class="queue-status__dot" aria-hidden="true"></span>
              <p class="queue-status__text">You are currently <strong id="queue-number">#14</strong> in queue for custom content.</p>
            </div>
            <div class="priority-options" role="radiogroup" aria-label="Queue priority">
              <button class="priority-pill is-selected" type="button" role="radio" aria-checked="true" data-priority="false">Standard Queue</button>
              <button class="priority-pill" type="button" role="radio" aria-checked="false" data-priority="true">Priority Rush (+$10)</button>
            </div>
            <button class="custom-submit" type="button" id="custom-submit">
              <span>Continue with Standard Queue</span>
            </button>
          </div>
          <button class="action-button" type="button" data-payment-type="premade">
            <span>Pre-made content</span>
          </button>
          <button class="action-button" type="button" id="tip-toggle" aria-expanded="false" aria-controls="tip-tray">
            <span>Leave a little something</span>
          </button>
          <div class="tip-tray" id="tip-tray" hidden aria-label="Choose tip amount">
            <div class="tip-pills" role="radiogroup" aria-label="Select tip amount">
              <button class="tip-pill" type="button" role="radio" aria-checked="false" data-amount="15">$15</button>
              <button class="tip-pill is-selected" type="button" role="radio" aria-checked="true" data-amount="25">$25</button>
              <button class="tip-pill" type="button" role="radio" aria-checked="false" data-amount="50">$50</button>
              <button class="tip-pill" type="button" role="radio" aria-checked="false" data-amount="75">$75</button>
              <button class="tip-pill" type="button" role="radio" aria-checked="false" data-amount="100">$100</button>
            </div>
            <button class="tip-submit" type="button" id="tip-submit">
              <span>Continue with $25</span>
            </button>
          </div>
        </div>

        <aside class="checkout-panel" id="checkout-panel" aria-hidden="true" aria-labelledby="checkout-title">
          <div class="checkout-panel__header">
            <p class="checkout-panel__eyebrow">YOUR SELECTION</p>
            <button class="checkout-panel__close" type="button" aria-label="Close payment selection">×</button>
          </div>
          <h2 id="checkout-title">—</h2>
          <p class="checkout-panel__note">Secure checkout will appear here once payment is connected.</p>
          <div class="checkout-slot" aria-label="Secure checkout placeholder">
            <p class="checkout-status" role="status" aria-live="polite">Choose an option to begin.</p>
            <form class="checkout-form" id="checkout-form" hidden>
              <div id="payment-element"></div>
              <button class="checkout-submit" type="submit">Continue securely <span aria-hidden="true">↗</span></button>
            </form>
          </div>
        </aside>
      </section>

      <footer>
        <span>INDEPENDENT CREATOR</span>
        <span>ALL RIGHTS RESERVED</span>
      </footer>
    </main>
    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
